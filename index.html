<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patricio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        .container{
            background:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            width:400px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            color:#1e3c72;
            font-size:50px;
            margin-bottom:15px;
        }

        p{
            color:#555;
            margin-bottom:25px;
            line-height:1.5;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#1e3c72;
            color:white;
            padding:12px 25px;
            border-radius:30px;
            transition:0.3s;
        }

        .btn:hover{
            background:#2a5298;
            transform:scale(1.05);
        }

        .icon{
            font-size:60px;
            margin-bottom:15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>

        <h1>Patricio</h1>

        <p>
            Bienvenido a mi página web.
            Este es un diseño básico creado con HTML y CSS,
            elegante, limpio y moderno.
        </p>

        <a href="#" class="btn">Conocer más</a>
    </div>

</body>
</html>
